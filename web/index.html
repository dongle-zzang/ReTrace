<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReTrace CCTV 미리보기</title>
  <style>
    body { margin: 0; background: #101722; color: #edf2f7; font: 16px system-ui, sans-serif; }
    main { max-width: 1440px; margin: auto; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #bcc9d8; }
    #output-mode { display: inline-block; margin: 8px 0; padding: 8px 14px; border-radius: 8px; background: #254367; color: #fff; font-weight: 700; }
    #streams { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; }
    article { background: #1a2534; border-radius: 12px; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
    h2 { margin: 0; font-size: 18px; }
    img.mjpeg { display: block; width: 100%; aspect-ratio: 16/9; background: #000; object-fit: contain; }
    .status { margin: 12px 16px; min-height: 24px; }
    button { padding: 7px 12px; border: 0; border-radius: 6px; cursor: pointer; }
  </style>
  <script defer src="/preview.js"></script>
</head>
<body>
  <main>
    <h1>ReTrace CCTV 미리보기</h1>
    <p id="output-mode" role="status" aria-live="polite">현재 출력: MJPEG</p>
    <p>각 카메라의 MJPEG 영상에 사람 검출 박스와 Track ID를 표시합니다.</p>
    <p id="page-status">입력 목록을 불러오는 중…</p>
    <section id="streams" aria-label="CCTV 영상"></section>
  </main>
</body>
</html>
